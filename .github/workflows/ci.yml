name: ci
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: system deps (tauri v2, investigation §4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      # NA-0686 / D-1325 (ENG-0075). `-q` is GONE: it hid which test binaries ran
      # and how many tests each held, so the only visible signal was "ok" and a
      # deleted test file could stay green at a lower total nobody compared.
      - name: test
        run: cargo test
      # ...and printing is not checking. The inventory is PINNED and compared, so
      # a test that disappears fails the build by NAME rather than shrinking a
      # number in a log.
      - name: test inventory (ENG-0075 — the suite must enumerate what it ran)
        run: bash scripts/ci/test_inventory.sh
      - name: clippy
        run: cargo clippy --all-targets -q -- -D warnings

  # NA-0677 / D613. ⚠ ADVISORY UNTIL BRANCH PROTECTION CHANGES: this repository
  # requires exactly one status context, `rust`. The two jobs below RUN and
  # REPORT on every PR, but they cannot block a merge until the operator adds
  # them to the required set. Green is not the same as blocking, and this comment
  # exists so nobody reads one as the other.
  public-safety:
    name: public-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Pattern provenance: adapted 2026-07-25 from the operator-side
      # publication scanner; scripts/ci/infra_literal_scan.py is now the source
      # of truth. The name values in it are salted digests -- the plaintext list
      # is operator-held, along with how to regenerate them.
      #
      # The spine's existing public-safety gate scans for private keys and cloud
      # tokens only. It has never carried an address, path or host pattern, which
      # is exactly why it ran green on the PRs that published a private LAN
      # address. This job is that missing pattern set.
      # NA-0686 / D-1325 (ENG-0089). The gate now has a gate. The scan's refusal
      # to report a pass over an empty input -- "NOTHING EXAMINED", exit 2 -- was
      # correct behaviour that NOTHING PROVED, which is how a CI gate silently
      # becomes a no-op when a base ref is not fetched. This step runs first so
      # that a broken instrument fails before it can report clean.
      - name: infra-literal scan SELFTEST (the gate's own controls)
        run: python3 scripts/ci/infra_literal_scan_selftest.py
      - name: infra-literal scan (Tier 1, whole tracked tree)
        run: python3 scripts/ci/infra_literal_scan.py --mode tree
      - name: infra-literal scan (Tier 2b, added lines)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 scripts/ci/infra_literal_scan.py --mode diff --base "origin/${{ github.base_ref }}"

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit (locked, pinned)
        run: cargo install --locked cargo-audit --version 0.22.0
      # --deny warnings, with every waived advisory named individually in
      # .cargo/audit.toml. No blanket waivers: dropping --deny warnings would
      # accept every future unmaintained or unsound crate silently.
      - name: cargo audit
        run: cargo audit --deny warnings
