name: ci
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: system deps (tauri v2, investigation §4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      # NA-0686 / D-1325 (ENG-0075). `-q` is GONE: it hid which test binaries ran
      # and how many tests each held, so the only visible signal was "ok" and a
      # deleted test file could stay green at a lower total nobody compared.
      - name: test
        run: cargo test
      # ...and printing is not checking. The inventory is PINNED and compared, so
      # a test that disappears fails the build by NAME rather than shrinking a
      # number in a log.
      - name: test inventory (ENG-0075 — the suite must enumerate what it ran)
        run: bash scripts/ci/test_inventory.sh
      - name: clippy
        run: cargo clippy --all-targets -q -- -D warnings

  # NA-0686 ADDENDUM (D-1325, OBS-C first half). THE SPLIT.
  #
  # ⚠ WHY A SEPARATE CONTEXT AT ALL. Until now the literal scan reported under
  # the name `public-safety`, so an operator-infrastructure literal and a leaked
  # private key FAILED AS THE SAME WORD. At the branch-protection layer the two
  # causes were indistinguishable: a reviewer saw "public-safety failed" and
  # could not tell whether a secret had escaped or a hostname had, without
  # opening the log. That is the same defect class as ENG-0082 (401 and 403
  # collapsing to one marker), one layer out. Distinct causes get distinct words.
  #
  # The job name, the step names and their order are byte-consistent with
  # `qsl-protocol`'s `infra-literal-scan.yml`, so all four repositories report
  # this gate under one name and old lane records keep reading true.
  #
  # ⚠ THE REQUIRED SET, RE-MEASURED AT THE GATE (never from this file):
  # branch protection on `main` requires exactly THREE contexts -- `rust`,
  # `advisories` and `infra-literal-scan`. THIS JOB IS REQUIRED AND BLOCKING.
  # `public-safety` is NOT in the required set. The duplicate job that carried
  # this same scan under that name is deleted in the same act that writes this
  # note: the operator's branch-protection change -- step 2 of the sequence the
  # deleted note laid out -- was measured COMPLETE before the deletion.
  # Repository rulesets add nothing to the picture: the rules endpoint for
  # `main` returns an empty list, so branch protection is the whole gate.
  #
  # ⚠ THE NA-0653 FAILURE WAS RE-MEASURED AT THIS BASE, NOT INHERITED. "A
  # required context that never reports blocks every pull request indefinitely"
  # is true and does not apply here: `public-safety` was already OUT of the
  # required set when its job was removed, so the deletion strands nothing.
  infra-literal-scan:
    name: infra-literal-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The scan's refusal to report a pass over an empty input -- "NOTHING
      # EXAMINED", exit 2 -- is correct behaviour that nothing proved until
      # NA-0686 guarded it. The selftest runs FIRST so a broken instrument fails
      # before it can report clean.
      - name: infra-literal scan SELFTEST (the gate's own controls)
        run: python3 scripts/ci/infra_literal_scan_selftest.py
      - name: infra-literal scan (Tier 1, whole tracked tree)
        run: python3 scripts/ci/infra_literal_scan.py --mode tree
      - name: infra-literal scan (Tier 2b, added lines)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 scripts/ci/infra_literal_scan.py --mode diff --base "origin/${{ github.base_ref }}"

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit (locked, pinned)
        run: cargo install --locked cargo-audit --version 0.22.0
      # --deny warnings, with every waived advisory named individually in
      # .cargo/audit.toml. No blanket waivers: dropping --deny warnings would
      # accept every future unmaintained or unsound crate silently.
      - name: cargo audit
        run: cargo audit --deny warnings

  # NA-0701 / D636-as-amended (spine D-1341, desktop D-0026). THE GUI INPUT
  # DRIVER: WebDriver clicks, keystrokes, and verbatim reads over the RUNNING
  # app, so a behavioral GUI defect fails a test instead of waiting for the
  # operator's live flight (it caught one before landing: the erase-form
  # error write skips the R-14 window resize — ENG row on the spine ledger).
  #
  # NON-REQUIRED at landing (the NA-0698 pattern): a brand-new CI surface —
  # the program's first GUI job — earns trust before it can block merges; the
  # named future-required anchor is the OPERATOR's branch-protection act
  # after consecutive greens across real lanes. Standard runner only.
  #
  # THE RECIPE IS PER-PRODUCER (SR-20 ext). Everything the box measured is
  # re-measured here — including the R164 §3 fact that the HARNESS sets
  # NEITHER automation env (the pinned tauri-driver injects both itself,
  # webdriver.rs:50-51). THIS JOB'S FIRST GREEN IS A FINDING, NOT AN
  # ASSUMPTION: the producer-identity step below exists to be diffed against
  # the box record (docs/testing/gui_driver.md carries the split).
  gui-driver:
    name: gui-driver
    runs-on: ubuntu-24.04
    # The D636 wall-clock STOP threshold, WITH teeth (A1.12): the measured
    # workflow default before this job was NO timeout anywhere (GitHub 360m).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: system deps (tauri v2 build + the WebDriver stack)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            webkit2gtk-driver xvfb dbus
      - uses: dtolnay/rust-toolchain@stable
      # PINNED --version 2.0.6 --locked: any bump is a LANE, not a drift —
      # the injection behavior above is corroborated at exactly this version.
      - name: tauri-driver (pinned)
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: producer identity (recorded EVERY run; diffed against the box)
        run: |
          rustc --version
          dpkg-query -W webkit2gtk-driver libwebkit2gtk-4.1-0 || true
          cargo install --list | grep -A1 tauri-driver
          echo "runner-image=$ImageOS/$ImageVersion"
      - name: debug build (the binary the driver drives)
        run: cargo build
      # SERIALIZED (--test-threads=1): one app instance at a time — the
      # NA-0700 C4 race lesson. The #[ignore] rows run FOR REAL here; the
      # wrapper strips QSLD_CONTINUE_ON_FAIL (R171 3.4), and this invocation
      # sets no harness env at all.
      - name: the six flows
        run: cargo test --test gui_driver -- --ignored --test-threads=1
      # Evidence EVERY run, pass or fail: verdict JSONL + run logs + censuses
      # + screenshots + MANIFEST.json, all under the A2.1 run root (repo-local
      # target/ on this runner). The ONE new third-party action, major-pinned
      # to match the measured house style (checkout@v5 + dtolnay are the only
      # other actions in this workflow).
      - name: evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-driver-evidence
          path: target/gui_driver_runs/
          if-no-files-found: warn
