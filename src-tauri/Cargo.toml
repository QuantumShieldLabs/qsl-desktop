[package]
name = "qsl-desktop-app"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "QSL desktop client — slices A–B: vault, identity and unlock lifecycle, plus relay connectivity. Research-stage; makes no security-assurance claims."

[lib]
name = "qsl_desktop_app"
path = "src/lib.rs"

[[bin]]
name = "qsl-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qsc = { git = "https://github.com/QuantumShieldLabs/qsl-protocol", rev = "e917e7e8a761b22034eabeb760a10c38b1c0fe30" }

[dev-dependencies]
tempfile = "3"
# NA-0700 (D-0025): tauri's own mock runtime for the IPC replay harness —
# dev-scoped feature enablement only; the shipped binary's feature set is
# unchanged (cargo unions this into test/bench builds exclusively).
tauri = { version = "2", features = ["test"] }
